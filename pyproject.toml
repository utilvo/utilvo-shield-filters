[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utilvo-shield-filters"
version = "1.0.0"
description = "Zero-dependency parser and domain matcher for Adblock Plus 2.0 and uBlock Origin static network filter rules."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Utilvo", email = "utilvo.com@gmail.com" }
]
keywords = [
  "adblock",
  "ublock-origin",
  "filterlist",
  "blocklist",
  "parser"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://utilvo.com/shield"
Source = "https://github.com/utilvo/utilvo-shield-filters"

[tool.setuptools.packages.find]
where = ["."]
include = ["utilvo_shield_filters*"]
