[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utilvo-shield-filters"
version = "1.0.2"
description = "Official ABP/uBlock Origin network filter parser and blocklist SDK for Utilvo Shield (https://utilvo.com/shield)."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Utilvo", email = "utilvo.com@gmail.com" },
  { name = "Islam Ayoub", email = "utilvo.com@gmail.com" }
]
keywords = [
  "adblock",
  "ublock-origin",
  "adguard",
  "filterlist",
  "blocklist",
  "popunder",
  "malvertising",
  "phishing",
  "privacy",
  "utilvo"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Security"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://utilvo.com/shield"
Platform = "https://utilvo.com"
FilterList = "https://utilvo.com/filters/utilvo-shield-filters.txt"
Repository = "https://github.com/utilvo/utilvo-shield-filters"
"Chrome Web Store" = "https://chromewebstore.google.com/detail/utilvo-shield/hafpojbddmohoboonogiplgmbjcekkkc"
"Firefox Add-ons" = "https://addons.mozilla.org/en-US/firefox/addon/utilvo-shield/"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.22975427"

[tool.setuptools.packages.find]
where = ["."]
include = ["utilvo_shield_filters*"]
